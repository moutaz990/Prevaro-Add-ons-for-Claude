<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      /* PLACEHOLDER logo: replace #logo with the real company logo file later. */
      :root { --ground: #0b1220; --ink: #ffffff; --accent: #c9a227; --font-display: "DejaVu Sans", Arial, sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; font-family: var(--font-display); }
      #logo { width: 360px; height: 360px; border: 6px solid var(--accent); display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 44px; font-weight: 700; letter-spacing: 0.08em; }
      #name { color: var(--ink); font-size: 72px; font-weight: 600; letter-spacing: 0.02em; }
      #tag { color: var(--accent); font-size: 32px; letter-spacing: 0.3em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="stack" class="clip" data-start="0" data-duration="5" data-track-index="0" style="display:flex;flex-direction:column;align-items:center;gap:48px;">
        <div id="logo">LOGO</div>
        <h1 id="name">YOUR COMPANY</h1>
        <div id="tag">TAGLINE</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#logo", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.fromTo("#name", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.9);
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.5);
      tl.to("#root", { opacity: 0, duration: 0.5 }, 4.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
